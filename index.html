<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GV Sweet · Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#0b0d12;--mute:#5d6578;--line:#e2e5ec;--chip:#eceff6;--acc:#1f4fd8;--blk:#0b0d12;--ok:#0f8a5f;--bad:#c93a34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#07080b;--card:#10131a;--ink:#eef1f7;--mute:#98a1b6;--line:#1d222d;--chip:#161b25;--blk:#000;--ok:#4ade9f;--bad:#ff7a73}
html{font-size:clamp(16px,.5vw + 12.5px,26px);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:5.5rem}
main{max-width:62rem;margin:0 auto;padding:1.2rem 1.1rem 2rem;width:100%}

h1 em,h2 em{font-style:normal;color:var(--acc)}
h2{font:700 1.2rem/1.25 "Libre Baskerville",Georgia,serif;margin:2rem 0 .8rem}
.lb{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}

.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.5rem 1rem;border-radius:999px;font:500 .88rem "Source Sans 3",sans-serif;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{border:0;background:var(--acc);color:#fff;padding:.85rem 1.3rem;border-radius:.9rem;font:600 .95rem "Source Sans 3",sans-serif;cursor:pointer;width:100%}
.btn.s{width:auto;padding:.5rem .95rem;font-size:.82rem;border-radius:999px}.btn.g{background:var(--chip);color:var(--ink)}.btn.d{background:none;color:var(--bad);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1rem 1.1rem;margin-bottom:.7rem}
.r{display:flex;justify-content:space-between;align-items:center;gap:.7rem;flex-wrap:wrap}

.k.hi{background:var(--blk);border-color:var(--blk);color:#fff}.k.hi small{color:#9fb4ee}

.bc small{font-size:.62rem}
.hb{margin-bottom:.8rem}.tr{height:.5rem;background:var(--chip);border-radius:1rem;overflow:hidden;margin-top:.25rem}.tr i{display:block;height:100%;background:var(--acc)}
.bd{font-size:.72rem;font-weight:600;padding:.2rem .65rem;border-radius:999px;background:var(--chip)}.bd.ok{color:var(--ok)}.bd.no{color:var(--bad)}
label{display:grid;gap:.25rem;font-size:.78rem;font-weight:600;color:var(--mute);margin-bottom:.6rem}
input,select{font:400 1rem "Source Sans 3",sans-serif;padding:.65rem .75rem;border:1px solid var(--line);border-radius:.75rem;background:var(--bg);color:var(--ink);width:100%}
.ck{display:flex;align-items:center;gap:.5rem;align-self:end}.ck input{width:1.2rem;height:1.2rem}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:0 .8rem}
.st{display:inline-flex;align-items:center;gap:.5rem}.st button{width:2.2rem;height:2.2rem;border:0;border-radius:50%;background:var(--chip);color:var(--acc);font-size:1.2rem;font-weight:700;cursor:pointer}.st b{min-width:1.5rem;text-align:center}
.st input{width:3.6rem;text-align:center;padding:.45rem .3rem;font-weight:700}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.sw{width:2.2rem;height:2.2rem;border-radius:50%;border:3px solid var(--card);outline:1px solid var(--line);cursor:pointer}.sw.on{outline:2px solid var(--ink)}
.bar,.side{background:var(--card);border-color:var(--line)}

.bar button{flex:1;padding:.4rem 0}.bar button.on,.side button.on{color:#fff;background:var(--blk)}
.bar span{display:block;font-size:1.15rem}
.side{display:none}
.bg2{position:absolute;top:0;right:22%;background:var(--bad);color:#fff;font-size:.6rem;border-radius:1rem;padding:0 .35rem;font-style:normal}
@media(min-width:900px){body{display:grid;grid-template-columns:15rem 1fr;padding-bottom:0}.bar{display:none}
.side{display:flex;flex-direction:column;gap:.2rem;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:1.5rem 1rem;border-right:1px solid var(--line)}
.side .lg{font:700 1.3rem "Libre Baskerville",Georgia,serif;margin-bottom:1.2rem;color:var(--ink)}.side .lg em{color:var(--acc)}
.side button{text-align:left;font-size:.92rem;padding:.65rem .9rem}main{padding:2rem 2.5rem}}
.qg{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.5rem;margin:.8rem 0}.qb{position:relative;display:grid;gap:.1rem;text-align:left;background:var(--chip);border:1px solid var(--line);border-radius:.9rem;padding:.75rem .8rem;color:var(--ink);font:inherit;cursor:pointer}.qb span{font-weight:600}.qb small{font-size:.8rem}.qb:active{transform:scale(.97)}.qb i{position:absolute;top:.4rem;right:.5rem;background:var(--blk);color:#fff;font-style:normal;font-size:.8rem;min-width:1.4rem;text-align:center;border-radius:1rem;padding:0 .3rem}.qk{border-color:var(--blk);border-width:2px}
.stk{position:sticky;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));background:var(--bg);padding:.7rem 0;margin-top:1rem}@media(min-width:900px){.stk{bottom:0}}
#toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.2rem;border-radius:999px;font-weight:600;z-index:9;display:none}
.empty{text-align:center;padding:1.6rem .8rem;color:var(--mute)}
</style>
</head>
<body>
<nav class="side" id="side"></nav>
<main><div id="app"></div></main>
<nav class="bar" id="bar"></nav><div id="toast" role="status"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)},fd=s=>s?s.slice(8)+'/'+s.slice(5,7):'';
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const gross=s=>sum(s.it,i=>i.q*i.pr),tot=s=>Math.max(0,gross(s)-(s.ds||0)),cst=s=>sum(s.it,i=>i.q*i.c),qt=s=>sum(s.it,i=>i.q),pago=s=>sum(s.pg,x=>x.v),saldo=s=>Math.max(0,tot(s)-pago(s)),quit=s=>saldo(s)<.005;
const blank=()=>({cfg:{nome:'GV Sweet',metaF:0,metaL:0,cor:'#1f4fd8',loc:'Escola, Fora, Entrega',pg:'Pix, Dinheiro',tema:'claro'},
 p:[['Ninho',10,3],['Ninho + KitKat',12,4],['Nutella',13,4],['Ninho + Nutella',15,5],['Ferrero',14,5],['Kinder Bueno',15,5]].map((d,i)=>({id:'p'+(i+1),n:d[0],pr:d[1],c:d[2],on:true})),s:[],c:[],o:[],e:[],d:[],pd:[],t:0});
let S=blank();const LS='gvsweet-gestao-azul';let dbDoc=null;
const adopt=o=>{const b=blank();S=Object.assign(b,o);S.cfg=Object.assign(b.cfg,o.cfg||{})};
try{const l=JSON.parse(localStorage.getItem(LS)||'null');if(l&&l.s)adopt(l)}catch(e){}
const list=k=>S.cfg[k].split(',').map(x=>x.trim()).filter(Boolean);
let V={tab:'painel',per:'7',flt:'todas',cart:{},cl:'',loc:list('loc')[0]||'',date:today(),ds:'',mode:'now',m:list('pg')[0]||'',ent:'',due:''};
let Q={cart:{},loc:list('loc')[0]||'',m:list('pg')[0]||'',cl:''};
let PV={d:today(),cart:{},nt:''};
const pQt=r=>sum(r.it,i=>i.q),pCs=r=>sum(r.it,i=>i.q*i.c);
const bst=()=>{const m={};if(!S.pd.length)return m;const f=S.pd.reduce((a,r)=>r.d<a?r.d:a,'9999-99-99');S.pd.forEach(r=>r.it.forEach(i=>{m[i.n]=(m[i.n]||0)+i.q}));S.s.forEach(s=>{if(s.d>=f)s.it.forEach(i=>{if(i.n in m)m[i.n]-=i.q})});return m};
const pTot=()=>{const P=S.p.filter(p=>p.on!==false);return [sum(P,p=>PV.cart[p.id]||0),sum(P,p=>(PV.cart[p.id]||0)*p.c)]};
const updP=()=>{const [u,c]=pTot(),a=$('#pT'),b=$('#pB');if(a)a.textContent=u+' un · '+R(c);if(b)b.textContent='Registrar produção · '+u+' un · '+R(c)};
const setSync=ok=>{const e=$('#sy');if(e)e.textContent=ok?'Salvo na sua conta':'Salvo neste aparelho'};
function theme(){const r=document.documentElement;r.style.setProperty('--acc',S.cfg.cor);if(S.cfg.tema==='escuro')r.dataset.theme='dark';else r.removeAttribute('data-theme')}
async function save(){S.t=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
 if(dbDoc){try{await dbDoc.set({j:JSON.stringify(S),t:S.t});setSync(true)}catch(e){setSync(false)}}else setSync(false)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
const inP=s=>{const t=today();return V.per==='0'?s.d===t:V.per==='7'?s.d>=addD(t,-6):V.per==='m'?s.d.slice(0,7)===t.slice(0,7):true};
const chips=(k,o,c)=>'<div class="chips">'+o.map(x=>`<button class="chip${c===x[0]?' on':''}" data-a="${k}" data-v="${esc(x[0])}">${x[1]}</button>`).join('')+'</div>';
const PER=[['0','Hoje'],['7','7 dias'],['m','Este mês'],['a','Tudo']];
const grp=(L,f)=>{const m={};L.forEach(s=>f(s).forEach(x=>{const o=m[x.k]=m[x.k]||{k:x.k,q:0,f:0,l:0};o.q+=x.q;o.f+=x.f;o.l+=x.l}));return Object.values(m).sort((a,b)=>b.f-a.f)};
const hb=(rows,u)=>{const mx=Math.max(1,...rows.map(r=>r.f));return rows.map(r=>`<div class="hb"><div class="r"><span>${esc(r.k)}</span><small>${r.q} ${u} · ${R(r.f)} · lucro <b class="${r.l>=0?'pos':'neg'}">${R(r.l)}</b></small></div><div class="tr"><i style="width:${r.f/mx*100}%"></i></div></div>`).join('')};
const SEC=[['painel','Painel','Visão <em>geral.</em>','Um retrato fiel do seu negócio, sempre atualizado.'],['rapida','Venda rápida','Venda <em>rápida.</em>','Toque nos sabores, escolha o pagamento e registre em segundos.'],['vender','Vender','Registrar uma <em>venda.</em>','Escolha os sabores, defina o pagamento e pronto.'],['vendas','Vendas','Histórico de <em>vendas.</em>','Cada venda registrada, do pedido ao recebimento.'],['clientes','Clientes','Sua <em>clientela.</em>','Quem compra, quanto compra e o que ainda está por receber.'],['encomendas','Encomendas','<em>Encomendas</em> e celebrações.','Pedidos para datas especiais, com entrega marcada.'],['produtos','Produtos','O <em>cardápio.</em>','Sabores, preços e custos, para saber o que realmente rende.'],['producao','Produção','A <em>produção.</em>','Registre o que saiu do forno, sabor por sabor, e quanto custou.'],['estoque','Estoque','Despensa e <em>estoque.</em>','Tenha à mão tudo o que precisa para produzir.'],['despesas','Despesas','Despesas e <em>custos.</em>','Tudo o que sai, organizado por categoria.'],['config','Ajustes','<em>Ajustes</em> da casa.','Deixe o sistema do seu jeito.']];
const head=id=>{const i=SEC.findIndex(x=>x[0]===id);return `<div class="r"><div class="lb">${String(i+1).padStart(2,'0')} — ${SEC[i][1]}</div><small id="sy"></small></div><h1>${SEC[i][2]}</h1><p class="lede">${SEC[i][3]}</p>`};
const cliS=n=>S.s.filter(s=>(s.cl||'').toLowerCase()===String(n).trim().toLowerCase());
const waL=(tel,msg)=>{let d=String(tel).replace(/\D/g,'');if(d&&d.length<=11)d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg)};
const T={
 clientes:{k:'c',a:'Novo cliente',f:[['n','Nome','text'],['tel','WhatsApp','tel'],['ob','Observação','text']],def:()=>({n:'',tel:'',ob:''}),
  x:r=>{const L=cliS(r.n),dv=sum(L,saldo),cp=sum(L,tot);return `<div class="r"><small>Comprou ${R(cp)} em ${L.length} venda(s)</small><b class="${dv?'neg':''}">${dv?'Deve '+R(dv):'Em dia'}</b></div>`+(dv&&r.tel?`<div class="acts"><a class="btn s" style="text-decoration:none" href="${waL(r.tel,'Olá, '+r.n+'! Passando para lembrar do valor de '+R(dv)+' dos brownies da '+S.cfg.nome+'. Pode me enviar pelo Pix?')}" target="_blank" rel="noopener">Cobrar no WhatsApp</a></div>`:'')}},
 encomendas:{k:'o',a:'Nova encomenda',f:[['cl','Cliente','text'],['desc','Pedido','text'],['val','Valor (R$)','num'],['dt','Entrega','date'],['st','Status','sel',['Pendente','Em produção','Pronta','Entregue','Cancelada']]],def:()=>({cl:'',desc:'',val:0,dt:today(),st:'Pendente'}),sort:(a,b)=>a.dt<b.dt?-1:1,
  hd:()=>{const P=S.o.filter(o=>o.st!=='Entregue'&&o.st!=='Cancelada');return `<div class="card r"><span>${P.length} em aberto</span><b>${R(sum(P,o=>o.val))}</b></div>`}},
 produtos:{k:'p',a:'Novo sabor',f:[['n','Nome','text'],['pr','Preço (R$)','num'],['c','Custo (R$)','num'],['on','Ativo','chk']],def:()=>({n:'Novo sabor',pr:10,c:3,on:true}),x:r=>`<small>Lucro por unidade: <b class="${r.pr-r.c>=0?'pos':'neg'}">${R(r.pr-r.c)}</b> (${r.pr?Math.round((r.pr-r.c)/r.pr*100):0}%)</small>`},
 estoque:{k:'e',a:'Novo item',f:[['n','Item','text'],['q','Quantidade','num'],['u','Unidade','sel',['un','kg','g','L','ml','cx','pacote']],['min','Avisar abaixo de','num']],def:()=>({n:'',q:0,u:'un',min:0}),x:r=>r.min>0&&r.q<=r.min?'<span class="bd no">Estoque baixo</span>':''},
 despesas:{k:'d',a:'Nova despesa',f:[['d','Data','date'],['n','Descrição','text'],['cat','Categoria','sel',['Ingredientes','Embalagem','Gás e energia','Transporte','Taxas','Outros']],['v','Valor (R$)','num']],def:()=>({d:today(),n:'',cat:'Ingredientes',v:0}),sort:(a,b)=>a.d<b.d?1:-1,
  hd:()=>{const m=today().slice(0,7),M=S.d.filter(x=>x.d.slice(0,7)===m);return `<div class="card r"><span>Total em ${m.slice(5)}/${m.slice(0,4)}</span><b>${R(sum(M,x=>x.v))}</b></div>`}}};
const inp=(t,r,f)=>{const [k,l,ty,o]=f,v=r[k],a=`data-t="${t}" data-i="${r.id}" data-k="${k}" data-ty="${ty}"`;
 if(ty==='sel')return `<label>${l}<select ${a}>${o.map(x=>`<option${x===v?' selected':''}>${x}</option>`).join('')}</select></label>`;

 return `<label>${l}<input ${a} type="${ty==='date'?'date':'text'}"${ty==='num'?' inputmode="decimal"':ty==='tel'?' inputmode="tel"':''} value="${esc(v)}"></label>`};
function tbl(name){const t=T[name];let rows=S[t.k].slice();if(t.sort)rows.sort(t.sort);
 return head(name)+`<button class="btn" data-a="nr" data-v="${name}">+ ${t.a}</button><div style="height:.9rem"></div>`+(t.hd?t.hd():'')+(rows.length?'':'<div class="card empty">Nada por aqui ainda. Comece adicionando o primeiro registro.</div>')+rows.map(r=>`<div class="card"><div class="fg">${t.f.map(f=>inp(t.k,r,f)).join('')}</div>${t.x?t.x(r):''}<div class="acts"><button class="btn s d" data-a="dr" data-t="${t.k}" data-i="${r.id}">Excluir</button></div></div>`).join('')}
function quick(){
 if(Q.m!=='later'&&!list('pg').includes(Q.m))Q.m=list('pg')[0]||'';
 if(!list('loc').includes(Q.loc))Q.loc=list('loc')[0]||'';
 const P=S.p.filter(p=>p.on!==false),sel=P.filter(p=>Q.cart[p.id]>0),T0=sum(sel,p=>Q.cart[p.id]*p.pr);
 return `<div class="card qk"><div class="r"><b>Venda rápida</b><small>Toque no sabor para somar</small></div><div class="qg">${P.map(p=>`<button class="qb" data-a="qadd" data-id="${p.id}"><span>${esc(p.n)}</span><small>${R(p.pr)}</small>${Q.cart[p.id]>0?`<i>${Q.cart[p.id]}</i>`:''}</button>`).join('')}</div>`
 +(sel.length?`<div class="chips">${sel.map(p=>`<button class="chip" data-a="qsub" data-id="${p.id}">${Q.cart[p.id]}× ${esc(p.n)} ✕</button>`).join('')}</div>`:'')
 +chips('qloc',list('loc').map(x=>[x,esc(x)]),Q.loc)+chips('qpay',list('pg').map(x=>[x,esc(x)]).concat([['later','Pagar depois']]),Q.m)
 +(Q.m==='later'?`<label>Nome de quem vai pagar<input data-q="cl" value="${esc(Q.cl)}" placeholder="Nome do cliente" autocomplete="off"></label>`:'')
 +`<div class="r"><b style="font-size:1.4rem">${R(T0)}</b><div class="acts" style="margin:0"><button class="btn s g" data-a="qclr">Limpar</button><button class="btn s" data-a="qreg">Registrar venda</button></div></div></div>`}
function rapida(){return head('rapida')+quick()+'<div class="acts"><button class="chip" data-a="tab" data-v="vender">Precisa de desconto ou de entrada? Abrir o formulário completo</button></div>'}
function painel(){
 const L=S.s.filter(inP),D=S.d.filter(x=>inP({d:x.d})),PD=S.pd.filter(inP),fat=sum(L,tot),cus=sum(L,cst),des=sum(D,x=>x.v),lu=fat-cus-des,q=sum(L,qt),rec=sum(L,pago),open=sum(S.s,saldo),pst=sum(Object.values(bst()),v=>Math.max(0,v));
 const kp=(l,v,c,h)=>`<div class="k${h?' hi':''}"><small>${l}</small><b class="${c||''}">${v}</b></div>`;
