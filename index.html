<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GV Sweet · Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#0b0d12;--mute:#5d6578;--line:#e2e5ec;--chip:#eceff6;--acc:#1f4fd8;--blk:#0b0d12;--ok:#0f8a5f;--bad:#c93a34;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--bg:#07080b;--card:#10131a;--ink:#eef1f7;--mute:#98a1b6;--line:#1d222d;--chip:#161b25;--blk:#000;--ok:#4ade9f;--bad:#ff7a73}
html{font-size:clamp(16px,.5vw + 12.5px,26px);scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.55 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;padding-bottom:5.5rem}
main{max-width:62rem;margin:0 auto;padding:1.2rem 1.1rem 2rem;width:100%}
h1{font:700 clamp(1.6rem,2.4vw,2.3rem)/1.2 "Libre Baskerville",Georgia,serif;margin:.3rem 0 1.2rem}
h1 em,h2 em{font-style:normal;color:var(--acc)}
h2{font:700 1.2rem/1.25 "Libre Baskerville",Georgia,serif;margin:1.8rem 0 .8rem}
small,.mut{color:var(--mute);font-size:.82rem}
.chips{display:flex;gap:.5rem;flex-wrap:wrap;margin:.6rem 0}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:.5rem 1rem;border-radius:999px;font:500 .88rem "Source Sans 3",sans-serif;cursor:pointer}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.btn{border:0;background:var(--acc);color:#fff;padding:.85rem 1.3rem;border-radius:.9rem;font:600 .95rem "Source Sans 3",sans-serif;cursor:pointer;width:100%;text-decoration:none;display:inline-block;text-align:center}
.btn.s{width:auto;padding:.5rem .95rem;font-size:.82rem;border-radius:999px}.btn.g{background:var(--chip);color:var(--ink)}.btn.d{background:none;color:var(--bad);border:1px solid var(--line)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:1rem 1.1rem;margin-bottom:.7rem}
.r{display:flex;justify-content:space-between;align-items:center;gap:.7rem;flex-wrap:wrap}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(10.5rem,1fr));gap:.7rem}
.k{background:var(--card);border:1px solid var(--line);border-radius:1.1rem;padding:.9rem 1rem}.k b{display:block;font:700 1.3rem/1.3 "Libre Baskerville",Georgia,serif}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bd{font-size:.72rem;font-weight:600;padding:.2rem .65rem;border-radius:999px;background:var(--chip)}.bd.ok{color:var(--ok)}.bd.no{color:var(--bad)}
label{display:grid;gap:.25rem;font-size:.78rem;font-weight:600;color:var(--mute);margin-bottom:.6rem}
input,select{font:400 1rem "Source Sans 3",sans-serif;padding:.65rem .75rem;border:1px solid var(--line);border-radius:.75rem;background:var(--bg);color:var(--ink);width:100%}
.ck{display:flex;align-items:center;gap:.5rem;align-self:end}.ck input{width:1.2rem;height:1.2rem}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(9.5rem,1fr));gap:0 .8rem}
.st{display:inline-flex;align-items:center;gap:.5rem}.st button{width:2.2rem;height:2.2rem;border:0;border-radius:50%;background:var(--chip);color:var(--acc);font-size:1.2rem;font-weight:700;cursor:pointer}.st input{width:3.6rem;text-align:center;padding:.45rem .3rem;font-weight:700}
.acts{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.7rem}
.sw{width:2.2rem;height:2.2rem;border-radius:50%;border:3px solid var(--card);outline:1px solid var(--line);cursor:pointer}
.bar,.side{background:var(--card);border-color:var(--line)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;border-top:1px solid var(--line);padding:.4rem .4rem calc(.4rem + env(safe-area-inset-bottom,0px))}
.bar button,.side button{border:0;background:none;color:var(--mute);font:500 .7rem "Source Sans 3",sans-serif;cursor:pointer;border-radius:.8rem}
.bar button{flex:1;padding:.4rem 0}.bar button.on,.side button.on{color:#fff;background:var(--blk)}
.bar span{display:block;font-size:1.15rem}.side{display:none}
@media(min-width:900px){body{display:grid;grid-template-columns:15rem 1fr;padding-bottom:0}.bar{display:none}
.side{display:flex;flex-direction:column;gap:.2rem;position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:1.5rem 1rem;border-right:1px solid var(--line)}
.side .lg{font:700 1.3rem "Libre Baskerville",Georgia,serif;margin-bottom:1.2rem;color:var(--ink)}.side .lg em{color:var(--acc);font-style:normal}
.side button{text-align:left;font-size:.92rem;padding:.65rem .9rem}main{padding:2rem 2.5rem}}
.qg{display:grid;grid-template-columns:repeat(auto-fit,minmax(8.5rem,1fr));gap:.5rem;margin:.8rem 0}
.qb{position:relative;display:grid;gap:.1rem;text-align:left;background:var(--chip);border:1px solid var(--line);border-radius:.9rem;padding:.75rem .8rem;color:var(--ink);font:inherit;cursor:pointer}.qb span{font-weight:600}.qb:active{transform:scale(.97)}
.qb i{position:absolute;top:.4rem;right:.5rem;background:var(--blk);color:#fff;font-style:normal;font-size:.8rem;min-width:1.4rem;text-align:center;border-radius:1rem;padding:0 .3rem}
.stk{position:sticky;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));background:var(--bg);padding:.7rem 0;margin-top:1rem}@media(min-width:900px){.stk{bottom:0}}
#toast{position:fixed;left:50%;bottom:5.5rem;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.2rem;border-radius:999px;font-weight:600;z-index:9;display:none}
.empty{text-align:center;padding:1.6rem .8rem;color:var(--mute)}
</style>
</head>
<body>
<nav class="side" id="side"></nav>
<main><div id="app"></div></main>
<nav class="bar" id="bar"></nav><div id="toast" role="status"></div>
<script>
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const R=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),addD=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)},fd=s=>s?s.slice(8)+'/'+s.slice(5,7):'';
const num=v=>{const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:0};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const AZ=(a,f)=>a.slice().sort((x,y)=>String(f(x)||'').localeCompare(String(f(y)||''),'pt-BR',{sensitivity:'base'}));
const low=s=>String(s||'').trim().toLowerCase();
const tot=s=>sum(s.it,i=>i.q*i.pr),cst=s=>sum(s.it,i=>i.q*i.c),qt=s=>sum(s.it,i=>i.q),pago=s=>sum(s.pg,x=>x.v),saldo=s=>Math.max(0,tot(s)-pago(s)),quit=s=>saldo(s)<.005;
const pq=r=>sum(r.it,i=>i.q),pc=r=>sum(r.it,i=>i.q*i.c);
const blank=()=>({cfg:{nome:'GV Sweet',cor:'#2f6bff',pre:'azulp',tema:'escuro',pg:'Dinheiro, Pix',loc:'Entrega, Escola'},
 p:[['Ferrero',14,5],['Kinder Bueno',15,5],['Ninho',10,3],['Ninho + KitKat',12,4],['Ninho + Nutella',15,5],['Nutella',13,4]].map((d,i)=>({id:'p'+(i+1),n:d[0],pr:d[1],c:d[2],on:true})),c:[],s:[],pd:[],x:[],t:0});
let S=blank();const LS='gvsweet-v3';let dbDoc=null;
const adopt=o=>{const b=blank();S=Object.assign(b,o);S.cfg=Object.assign(b.cfg,o.cfg||{})};
try{const l=JSON.parse(localStorage.getItem(LS)||'null');if(l&&l.s)adopt(l)}catch(e){}
const list=k=>S.cfg[k].split(',').map(x=>x.trim()).filter(Boolean);
let V={tab:'painel',per:'7',flt:'todas',cart:{},cl:'',sh:false,loc:'',m:'',nc:'',nt:'',xd:'',xn:'',xv:''};
let PV={d:today(),cart:{},nt:''};
const PRE=[['azul','Azul claro','#1f4fd8','claro',{}],['azulp','Azul e preto','#2f6bff','escuro',{}],['verm','Preto e vermelho','#e5303c','escuro',{'--bg':'#080607','--card':'#130e0f','--line':'#2b1b1e','--chip':'#1d1417','--mute':'#a89aa0'}],['verde','Verde e preto','#22c55e','escuro',{'--bg':'#060907','--card':'#0e130f','--line':'#1b261d','--chip':'#141c15'}],['roxo','Roxo e preto','#8b5cf6','escuro',{'--bg':'#07060b','--card':'#100e18','--line':'#211d33','--chip':'#171425'}],['laranja','Laranja e preto','#f97316','escuro',{'--bg':'#090705','--card':'#14100c','--line':'#2a2018','--chip':'#1d1710'}],['choc','Chocolate','#8a4b2a','claro',{'--bg':'#f6f0ea','--line':'#e6d9cd','--chip':'#efe4d8','--blk':'#3a2216'}],['rosa','Rosa','#d6336c','claro',{'--bg':'#fbf3f6','--line':'#f0dde5','--chip':'#f7e6ed'}]];
const VK=['--bg','--card','--line','--chip','--mute','--blk','--ink'];
function theme(){const r=document.documentElement,p=PRE.find(x=>x[0]===S.cfg.pre);VK.forEach(k=>r.style.removeProperty(k));r.style.setProperty('--acc',S.cfg.cor);if(p?p[3]==='escuro':S.cfg.tema==='escuro')r.dataset.theme='dark';else r.removeAttribute('data-theme');if(p)Object.entries(p[4]).forEach(([k,v])=>r.style.setProperty(k,v))}
const setSync=ok=>{const e=$('#sy');if(e)e.textContent=ok?'Salvo na sua conta':'Salvo neste aparelho'};
async function save(){S.t=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}
 if(dbDoc){try{await dbDoc.set({j:JSON.stringify(S),t:S.t});setSync(true)}catch(e){setSync(false)}}else setSync(false)}
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display='none',2200)}
const inP=d=>{const t=today();return V.per==='0'?d===t:V.per==='7'?d>=addD(t,-6):V.per==='m'?d.slice(0,7)===t.slice(0,7):true};
const chips=(k,o,c)=>'<div class="chips">'+o.map(x=>`<button class="chip${c===x[0]?' on':''}" data-a="${k}" data-v="${esc(x[0])}">${x[1]}</button>`).join('')+'</div>';
const PER=[['0','Hoje'],['7','7 dias'],['m','Este mês'],['a','Tudo']];
const head=t=>`<div class="r"><span></span><small id="sy"></small></div><h1>${t}</h1>`;
const names=()=>AZ(S.c,c=>c.n).map(c=>c.n);
const act=()=>AZ(S.p.filter(p=>p.on),p=>p.n);
const bst=()=>{const m={};if(!S.pd.length)return m;const f=S.pd.reduce((a,r)=>r.d<a?r.d:a,'9999-99-99');S.pd.forEach(r=>r.it.forEach(i=>{m[i.n]=(m[i.n]||0)+i.q}));S.s.forEach(s=>{if(s.d>=f)s.it.forEach(i=>{m[i.n]=(m[i.n]||0)-i.q})});return m};
const sumry=s=>s.it.map(i=>i.q+'x '+esc(i.n)).join(', ');
const waL=(tel,msg)=>{let d=String(tel).replace(/\D/g,'');if(d&&d.length<=11)d='55'+d;return 'https://wa.me/'+d+'?text='+encodeURIComponent(msg)};
const payIt=(s,m)=>{const v=saldo(s);if(v>0)s.pg.push({d:today(),v,m})};
const dev=n=>sum(S.s.filter(s=>low(s.cl)===low(n)),saldo);

function painel(){
 const L=S.s.filter(s=>inP(s.d)),X=S.x.filter(x=>inP(x.d)),PD=S.pd.filter(r=>inP(r.d)),fat=sum(L,tot),cus=sum(L,cst),des=sum(X,x=>x.v),lu=fat-cus-des,open=sum(S.s,saldo),st=bst(),sk=AZ(Object.keys(st),k=>k);
 const kp=(l,v,c)=>`<div class="k"><small>${l}</small><b class="${c||''}">${v}</b></div>`;
 let h=head('Visão <em>geral.</em>')+chips('per',PER,V.per)+'<div class="kp">'+kp('Faturamento',R(fat))+kp('Lucro líquido',R(lu),lu>=0?'pos':'neg')+kp('Brownies vendidos',sum(L,qt))+kp('Brownies produzidos',sum(PD,pq))+kp('Custo de produção',R(cus))+kp('Despesas',R(des))+kp('A receber (total)',R(open),open?'neg':'')+kp('Em estoque',sum(sk,k=>Math.max(0,st[k])))+'</div>';
 if(sk.length)h+='<h2>Estoque por <em>sabor.</em></h2><div class="card">'+sk.map(k=>`<div class="r"><span>${esc(k)}</span><b class="${st[k]<0?'neg':''}">${st[k]} un</b></div>`).join('')+'</div>';
 const g={};L.forEach(s=>s.it.forEach(i=>{const o=g[i.n]=g[i.n]||{q:0,f:0};o.q+=i.q;o.f+=i.q*i.pr}));
 h+='<h2>Sabores <em>vendidos.</em></h2><div class="card">'+(Object.keys(g).length?AZ(Object.keys(g),k=>k).map(k=>`<div class="r"><span>${esc(k)}</span><small>${g[k].q} un · ${R(g[k].f)}</small></div>`).join(''):'<span class="mut">Sem vendas no período.</span>')+'</div>';
 return h}

function vender(){
 const P=act(),SK=bst(),has=S.pd.length>0,sel=P.filter(p=>V.cart[p.id]>0),T0=sum(sel,p=>V.cart[p.id]*p.pr),pgs=list('pg'),locs=list('loc'),cn=names();
 if(V.m!=='later'&&!pgs.includes(V.m))V.m=pgs[0]||'';
 if(!locs.includes(V.loc))V.loc=locs[0]||'';
 const left=p=>(SK[p.n]||0)-(V.cart[p.id]||0);
 return head('Venda <em>rápida.</em>')
 +`<div class="card"><div class="r"><b>Toque no sabor para somar</b>${has?`<small>Total em estoque: <b>${sum(P,left)}</b></small>`:''}</div><div class="qg">${P.map(p=>`<button class="qb" data-a="add" data-id="${p.id}"><span>${esc(p.n)}</span><small>${R(p.pr)}${has?' · <b class="'+(left(p)>0?'':'neg')+'">'+left(p)+' em estoque</b>':''}</small>${V.cart[p.id]>0?`<i>${V.cart[p.id]}</i>`:''}</button>`).join('')}</div>`
 +(sel.length?`<div class="chips">${sel.map(p=>`<button class="chip" data-a="sub" data-id="${p.id}">${V.cart[p.id]}× ${esc(p.n)} ✕</button>`).join('')}</div>`:'')
 +(locs.length?chips('loc',locs.map(x=>[x,esc(x)]),V.loc):'')
 +chips('pay',pgs.map(x=>[x,esc(x)]).concat([['later','Pagar depois']]),V.m)
 +(V.m==='later'?'':`<div class="chips"><button class="chip" data-a="sh">${V.sh?'Ocultar lista':'👤 Colocar na conta de um cliente'}</button></div>`)
 +((V.m==='later'||V.sh)&&cn.length?'<small>Toque no cliente para lançar na conta dele</small>'+chips('pcl',cn.map(n=>[n,esc(n)]),V.cl):'')
 +`<label>${V.m==='later'?'Cliente (obrigatório). Novo? Digite o nome':'Nome do cliente (opcional)'}<input data-v="cl" list="cls" value="${esc(V.cl)}" placeholder="Nome do cliente" autocomplete="off"></label><datalist id="cls">${cn.map(n=>`<option value="${esc(n)}">`).join('')}</datalist>`
 +`<div class="r"><b style="font-size:1.4rem">${R(T0)}</b><div class="acts" style="margin:0"><button class="btn s g" data-a="clr">Limpar</button><button class="btn s" data-a="reg">Registrar venda</button></div></div></div>`}

function vendas(){
 const L=S.s.filter(s=>inP(s.d)).filter(s=>V.flt==='todas'||(V.flt==='pagas'?quit(s):!quit(s)));
 const h=head('Histórico de <em>vendas.</em>')+chips('per',PER,V.per)+chips('flt',[['todas','Todas'],['pagas','Pagas'],['abertas','A receber']],V.flt);
 if(!L.length)return h+'<div class="card empty">Nenhuma venda encontrada neste filtro.</div>';
 const k={},anon=[];L.forEach(s=>{const n=low(s.cl);if(!n){anon.push([s]);return}(k[n]=k[n]||[]).push(s)});
 const G=AZ(Object.values(k),a=>a[0].cl).concat(anon);
 return h+`<div class="card r"><span>${L.length} venda(s)</span><b>${R(sum(L,tot))}</b></div>`+G.map(a=>{const s0=a[0],nm=s0.cl||'Sem nome',sal=sum(a,saldo);
  return `<div class="card"><div class="r"><b>${esc(nm)}</b>${sal<.005?'<span class="bd ok">Pago</span>':`<span class="bd no">Falta ${R(sal)}</span>`}</div>`
  +a.map(s=>`<div class="r" style="margin-top:.35rem"><small>${fd(s.d)} · ${esc(s.loc)} · ${sumry(s)} · ${R(tot(s))}${quit(s)?' ✓':''}</small><button class="btn s d" data-a="del" data-id="${s.id}">Excluir</button></div>`).join('')
  +`<div class="r" style="margin-top:.5rem"><b>${R(sum(a,tot))}</b><small>lucro ${R(sum(a,s=>tot(s)-cst(s)))}</small></div><div class="acts">${sal<.005?'':list('pg').map((m,i)=>`<button class="btn s${i?' g':''}" data-a="recc" data-id="${s0.id}" data-n="${esc(s0.cl||'')}" data-m="${esc(m)}">Recebi${s0.cl?' tudo':''} · ${esc(m)}</button>`).join('')}${s0.cl?`<button class="btn s g" data-a="cta" data-n="${esc(nm)}">+ Lançar na conta</button>`:''}</div></div>`}).join('')}

function clientes(){
 return head('Sua <em>clientela.</em>')+`<div class="card"><div class="fg"><label>Nome<input data-v="nc" value="${esc(V.nc)}"></label><label>WhatsApp (opcional)<input data-v="nt" inputmode="tel" value="${esc(V.nt)}"></label></div><button class="btn" data-a="addc">+ Cadastrar cliente</button></div>`
 +(S.c.length?'':'<div class="card empty">Nenhum cliente ainda. Eles entram sozinhos quando você anota uma venda com nome.</div>')
 +AZ(S.c,c=>c.n).map(c=>{const L=S.s.filter(s=>low(s.cl)===low(c.n)),d=sum(L,saldo);
  return `<div class="card"><div class="fg"><label>Nome<input data-ce="n" data-i="${c.id}" value="${esc(c.n)}"></label><label>WhatsApp<input data-ce="tel" data-i="${c.id}" inputmode="tel" value="${esc(c.tel)}"></label></div><div class="r"><small>Comprou ${R(sum(L,tot))} em ${L.length} venda(s)</small><b class="${d?'neg':''}">${d?'Deve '+R(d):'Em dia'}</b></div><div class="acts"><button class="btn s g" data-a="cta" data-n="${esc(c.n)}">+ Lançar venda</button>${d&&c.tel?`<a class="btn s" href="${waL(c.tel,'Olá, '+c.n+'! Passando para lembrar do valor de '+R(d)+' dos brownies da '+S.cfg.nome+'. Pode me enviar pelo Pix?')}" target="_blank" rel="noopener">Cobrar no WhatsApp</a>`:''}<button class="btn s d" data-a="delc" data-i="${c.id}">Excluir</button></div></div>`}).join('')}

function updP(){const P=act(),u=sum(P,p=>PV.cart[p.id]||0),c=sum(P,p=>(PV.cart[p.id]||0)*p.c),a=$('#pT'),b=$('#pB');if(a)a.textContent=u+' un · '+R(c);if(b)b.textContent='Registrar produção · '+u+' un · '+R(c)}
function producao(){
 const P=act(),u=sum(P,p=>PV.cart[p.id]||0),c=sum(P,p=>(PV.cart[p.id]||0)*p.c),L=S.pd.filter(r=>inP(r.d)).sort((a,b)=>a.d<b.d?1:-1),st=bst(),sk=AZ(Object.keys(st),k=>k);
 let h=head('A <em>produção.</em>')+`<label>Data da produção<input type="date" data-pf="d" value="${PV.d}"></label><h2>O que você <em>produziu?</em></h2>`
 +P.map(p=>`<div class="card r"><div><b>${esc(p.n)}</b><br><small>custo ${R(p.c)} por unidade</small></div><div class="st"><button data-a="pqty" data-id="${p.id}" data-d="-1" aria-label="Menos">−</button><input data-pq="${p.id}" inputmode="numeric" value="${PV.cart[p.id]||0}" aria-label="Quantidade de ${esc(p.n)}"><button data-a="pqty" data-id="${p.id}" data-d="1" aria-label="Mais">+</button></div></div>`).join('')
 +`<label>Observação (opcional)<input data-pf="nt" value="${esc(PV.nt)}" placeholder="Ex.: fornada de sexta"></label><div class="card r"><span>Total da fornada</span><b id="pT">${u} un · ${R(c)}</b></div><div class="stk"><button class="btn" data-a="preg" id="pB">Registrar produção · ${u} un · ${R(c)}</button></div>`;
 if(sk.length)h+='<h2>Prontos para <em>vender.</em></h2><div class="card">'+sk.map(k=>`<div class="r"><span>${esc(k)}</span><b class="${st[k]<0?'neg':''}">${st[k]} un</b></div>`).join('')+'<small>Produzido menos vendido, a partir da primeira produção registrada.</small></div>';
 h+='<h2>Histórico de <em>produção.</em></h2>'+chips('per',PER,V.per);
 if(!L.length)return h+'<div class="card empty">Nenhuma produção neste período.</div>';
 return h+`<div class="card r"><span>${sum(L,pq)} brownies produzidos</span><b>${R(sum(L,pc))}</b></div>`+L.map(r=>`<div class="card"><div class="r"><b>${fd(r.d)}</b><b>${R(pc(r))}</b></div><small>${AZ(r.it,i=>i.n).map(i=>i.q+'x '+esc(i.n)).join(', ')}${r.nt?' · '+esc(r.nt):''}</small><div style="margin-top:.3rem"><small>${pq(r)} brownies · ${R(pc(r)/pq(r))} por unidade</small></div><div class="acts"><button class="btn s d" data-a="dr" data-t="pd" data-i="${r.id}">Excluir</button></div></div>`).join('')}

function cardapio(){
 return head('O <em>cardápio.</em>')+'<button class="btn" data-a="addp">+ Novo sabor</button><div style="height:.9rem"></div>'+AZ(S.p,p=>p.n).map(p=>`<div class="card"><div class="fg"><label>Nome<input data-e="p" data-i="${p.id}" data-k="n" value="${esc(p.n)}"></label><label>Preço (R$)<input data-e="p" data-i="${p.id}" data-k="pr" data-num="1" inputmode="decimal" value="${p.pr}"></label><label>Custo (R$)<input data-e="p" data-i="${p.id}" data-k="c" data-num="1" inputmode="decimal" value="${p.c}"></label><label class="ck"><input type="checkbox" data-e="p" data-i="${p.id}" data-k="on"${p.on?' checked':''}> Ativo</label></div><div class="r"><small>Lucro por unidade: <b class="${p.pr-p.c>=0?'pos':'neg'}">${R(p.pr-p.c)}</b></small><button class="btn s d" data-a="dr" data-t="p" data-i="${p.id}">Excluir</button></div></div>`).join('')+'<small>Mudar o nome de um sabor não altera as vendas e produções já registradas.</small>'}

function despesas(){
 const m=today().slice(0,7),M=S.x.filter(x=>x.d.slice(0,7)===m);
 return head('Despesas e <em>custos.</em>')+`<div class="card"><div class="fg"><label>Descrição<input data-v="xn" value="${esc(V.xn)}" placeholder="Ex.: Chocolate"></label><label>Valor (R$)<input data-v="xv" inputmode="decimal" value="${esc(V.xv)}"></label><label>Data<input type="date" data-v="xd" value="${V.xd||today()}"></label></div><button class="btn" data-a="addx">+ Anotar despesa</button></div><div class="card r"><span>Total em ${m.slice(5)}/${m.slice(0,4)}</span><b>${R(sum(M,x=>x.v))}</b></div>`
 +(S.x.length?'':'<div class="card empty">Nenhuma despesa anotada.</div>')+AZ(S.x,x=>x.n).map(x=>`<div class="card r"><div><b>${esc(x.n)}</b><br><small>${fd(x.d)}</small></div><div class="r"><b>${R(x.v)}</b><button class="btn s d" data-a="dr" data-t="x" data-i="${x.id}">Excluir</button></div></div>`).join('')}

function config(){const c=S.cfg,f=(k,l)=>`<label>${l}<input data-cfg="${k}" value="${esc(c[k])}"></label>`;
 return head('<em>Ajustes</em> da casa.')+'<div class="card">'+f('nome','Nome do negócio')+f('loc','Locais de venda (separe por vírgula)')+f('pg','Formas de pagamento (separe por vírgula)')
 +`<div class="lb" style="font-weight:600;margin-bottom:.2rem"><small>Temas prontos</small></div>${chips('pre',PRE.map(x=>[x[0],x[1]]),c.pre)}<div><small>Cor de destaque</small></div><div class="chips">${['#1f4fd8','#2f6bff','#0ea5e9','#e5303c','#dc2626','#f97316','#d6336c','#8b5cf6','#22c55e','#0f766e','#8a4b2a'].map(x=>`<button class="sw" style="background:${x}" data-a="cor" data-v="${x}" aria-label="Cor ${x}"></button>`).join('')}</div><label>Escolher qualquer cor<input type="color" data-cfg="cor" value="${c.cor}" style="height:2.8rem;padding:.2rem"></label></div>`
 +'<h2>Segurança dos <em>dados.</em></h2><div class="card"><small>Seus dados ficam neste aparelho e, quando possível, na sua conta. Vale baixar um backup de tempos em tempos.</small><div class="acts"><button class="btn s" data-a="bk">Baixar backup</button><button class="btn s g" data-a="csv">Exportar vendas (Excel)</button><label class="btn s g" style="margin:0;color:var(--ink)">Importar backup<input id="imp" type="file" accept=".json" style="display:none"></label></div></div><div class="card"><small>Apagar tudo e voltar ao início.</small><div class="acts"><button class="btn s d" data-a="wipe">Apagar tudo</button></div></div>'}

const SEC=[['painel','Painel','◧'],['vender','Vender','⚡'],['vendas','Vendas','☰'],['clientes','Clientes','◎'],['producao','Produção'],['cardapio','Cardápio'],['despesas','Despesas'],['config','Ajustes']];
const VW={painel,vender,vendas,clientes,producao,cardapio,despesas,config,mais:()=>head('Tudo em <em>um só lugar.</em>')+SEC.slice(4).map(x=>`<button class="btn g" style="margin-bottom:.6rem;text-align:left" data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join('')};
function render(){theme();const open=S.s.filter(s=>!quit(s)).length;
 $('#app').innerHTML=VW[V.tab](),setSync(!!dbDoc&&S.sync);
 const bar=SEC.slice(0,4).concat([['mais','Mais','⋯']]);
 $('#bar').innerHTML=bar.map(t=>`<button class="${V.tab===t[0]||(t[0]==='mais'&&!bar.some(b=>b[0]===V.tab))?'on':''}" data-a="tab" data-v="${t[0]}"><span>${t[2]}</span>${t[1]}${t[0]==='vendas'&&open?` (${open})`:''}</button>`).join('');
 $('#side').innerHTML=`<div class="lg">${esc(S.cfg.nome.split(' ')[0])} <em>${esc(S.cfg.nome.split(' ').slice(1).join(' ')||'·')}</em></div>`+SEC.map(x=>`<button class="${V.tab===x[0]?'on':''}" data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join('')}
const dl=(name,data)=>{(window.claude&&claude.use?claude.use('downloads'):Promise.resolve(null)).then(x=>{if(!x)throw 0;return x.save({filename:name,data})}).then(()=>toast('Arquivo pronto')).catch(()=>toast('Não foi possível baixar aqui'))};
const ask=(b,txt,fn)=>{if(b.dataset.arm){fn();return}b.dataset.arm=1;const o=b.textContent;b.textContent=txt;setTimeout(()=>{if(b.isConnected){b.textContent=o;delete b.dataset.arm}},3000)};
const ensureC=n=>{const ex=S.c.find(c=>low(c.n)===low(n));if(ex)return ex.n;S.c.push({id:uid(),n:n.trim(),tel:''});return n.trim()};
const A={tab:d=>{V.tab=d.v;render();scrollTo(0,0)},per:d=>{V.per=d.v;render()},flt:d=>{V.flt=d.v;render()},loc:d=>{V.loc=d.v;render()},pay:d=>{V.m=d.v;render()},sh:()=>{V.sh=!V.sh;render()},
 add:d=>{V.cart[d.id]=(V.cart[d.id]||0)+1;render()},sub:d=>{V.cart[d.id]=Math.max(0,(V.cart[d.id]||0)-1);render()},clr:()=>{V.cart={};render()},pcl:d=>{V.cl=V.cl===d.v?'':d.v;render()},
 reg:()=>{const it=S.p.filter(p=>V.cart[p.id]>0).map(p=>({n:p.n,q:V.cart[p.id],pr:p.pr,c:p.c}));if(!it.length){toast('Toque em um sabor primeiro');return}
  const later=V.m==='later',n0=V.cl.trim();if(later&&!n0){toast('Informe o cliente para pagar depois');return}
  const cl=n0?ensureC(n0):'',d=today(),t=sum(it,i=>i.q*i.pr);S.s.unshift({id:uid(),d,cl,loc:V.loc,it,pg:later?[]:[{d,v:t,m:V.m}]});V.cart={};V.cl='';save();render();toast('Venda registrada')},
 cta:d=>{V.cl=d.n;V.sh=true;V.tab='vender';render();scrollTo(0,0)},
 recc:d=>{const L=d.n?S.s.filter(s=>low(s.cl)===low(d.n)&&!quit(s)):S.s.filter(s=>s.id===d.id);L.forEach(s=>payIt(s,d.m));save();render();toast('Pagamento registrado')},
 del:(d,b)=>ask(b,'Confirmar?',()=>{S.s=S.s.filter(x=>x.id!==d.id);save();render()}),
 addc:()=>{const n=V.nc.trim();if(!n){toast('Digite o nome do cliente');return}if(S.c.some(c=>low(c.n)===low(n))){toast('Esse cliente já está cadastrado');return}S.c.push({id:uid(),n,tel:V.nt.trim()});V.nc='';V.nt='';save();render();toast('Cliente cadastrado')},
 delc:(d,b)=>ask(b,'Confirmar?',()=>{S.c=S.c.filter(x=>x.id!==d.i);save();render()}),
 pqty:d=>{PV.cart[d.id]=Math.max(0,(PV.cart[d.id]||0)+(+d.d));render()},
 preg:()=>{const it=S.p.filter(p=>PV.cart[p.id]>0).map(p=>({n:p.n,q:PV.cart[p.id],c:p.c}));if(!it.length){toast('Informe a quantidade de algum sabor');return}S.pd.unshift({id:uid(),d:PV.d||today(),it,nt:(PV.nt||'').trim()});PV.cart={};PV.nt='';save();render();toast('Produção registrada')},
 addp:()=>{S.p.push({id:uid(),n:'Novo sabor',pr:10,c:3,on:true});save();render();toast('Sabor adicionado')},
 addx:()=>{const n=V.xn.trim(),v=num(V.xv);if(!n||!v){toast('Informe a descrição e o valor');return}S.x.push({id:uid(),d:V.xd||today(),n,v});V.xn='';V.xv='';V.xd='';save();render();toast('Despesa anotada')},
 dr:(d,b)=>ask(b,'Confirmar?',()=>{S[d.t]=S[d.t].filter(x=>x.id!==d.i);save();render()}),
 pre:d=>{const p=PRE.find(x=>x[0]===d.v);if(p){S.cfg.pre=p[0];S.cfg.cor=p[2];S.cfg.tema=p[3];save();render()}},cor:d=>{S.cfg.cor=d.v;save();render()},
 bk:()=>dl('gv-sweet-backup-'+today()+'.json',JSON.stringify(S)),
 csv:()=>{const r=[['Data','Cliente','Local','Itens','Total','Custo','Lucro','Pago','Falta']],f=n=>n.toFixed(2).replace('.',',');S.s.forEach(s=>r.push([s.d,s.cl,s.loc,s.it.map(i=>i.q+'x '+i.n).join(' | '),f(tot(s)),f(cst(s)),f(tot(s)-cst(s)),f(pago(s)),f(saldo(s))]));
  dl('gv-sweet-vendas-'+today()+'.csv','\ufeff'+r.map(x=>x.map(c=>'"'+String(c==null?'':c).replace(/"/g,'""')+'"').join(';')).join('\n'))},
 wipe:(d,b)=>ask(b,'Tem certeza?',()=>{const c=S.cfg;S=blank();S.cfg=c;save();render();toast('Tudo apagado')})};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b.dataset,b)});
document.addEventListener('input',e=>{const t=e.target.dataset;if(t.v)V[t.v]=e.target.value;if(t.pf)PV[t.pf]=e.target.value;if(t.pq){PV.cart[t.pq]=Math.max(0,parseInt(e.target.value)||0);updP()}});
document.addEventListener('change',e=>{const t=e.target,d=t.dataset;
 if(d.e){const r=S[d.e].find(x=>x.id===d.i);if(r){r[d.k]=t.type==='checkbox'?t.checked:d.num?num(t.value):t.value;save()}}
 if(d.ce){const r=S.c.find(x=>x.id===d.i);if(r){if(d.ce==='n'){const nv=t.value.trim();if(nv&&!S.c.some(x=>x!==r&&low(x.n)===low(nv))){S.s.forEach(s=>{if(low(s.cl)===low(r.n))s.cl=nv});r.n=nv}else t.value=r.n}else r.tel=t.value;save()}}
 if(d.cfg){S.cfg[d.cfg]=t.value;if(d.cfg==='cor'){}save();theme()}
 if(t.id==='imp'&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);if(!o.s||!o.p)throw 0;adopt(o);save();render();toast('Backup importado')}catch(x){toast('Arquivo inválido')}};fr.readAsText(t.files[0])}});
render();
(async()=>{try{if(!window.claude)return;const db=await claude.use('db'),u=await claude.use('user');if(!db||!u)return;
 dbDoc=db.doc('data/users/'+await u.id()+'/gv3');const snap=await dbDoc.get();
 if(snap.exists){const d=snap.data();if(d.t>S.t){adopt(JSON.parse(d.j));S.t=d.t;try{localStorage.setItem(LS,d.j)}catch(e){}S.sync=1;render()}else{S.sync=1;if(S.t>d.t)save();render()}}
 else{S.sync=1;if(S.t)save();render()}}catch(e){dbDoc=null}})();
})();
</script>
</body>
</html>
